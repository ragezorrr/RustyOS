[workspace]
resolver = "2"
members = [
    "apps/rusty-files",
    "apps/rusty-greeter",
    "apps/rusty-installer",
    "apps/rusty-polkit",
    "apps/rusty-settings",
    "apps/rusty-terminal",
    "apps/rusty-view",
    "crates/rusty-animation",
    "crates/rusty-app",
    "crates/rusty-compositor",
    "crates/rusty-ipc",
    "crates/rusty-services",
    "crates/rusty-ui",
    "crates/rusty-wm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
authors = ["RustyOS Contributors"]

[workspace.dependencies]
fontdue = "0.9.5"
gl_generator = "0.14.0"
libc = "0.2.191"
rusty-animation = { path = "crates/rusty-animation" }
rusty-app = { path = "crates/rusty-app" }
rusty-ipc = { path = "crates/rusty-ipc" }
rusty-services = { path = "crates/rusty-services" }
rusty-ui = { path = "crates/rusty-ui" }
rusty-wm = { path = "crates/rusty-wm" }
smithay = { version = "0.7.0", default-features = false, features = [
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_session_libseat",
    "backend_udev",
    "backend_winit",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
    "xwayland",
] }
smithay-client-toolkit = { version = "0.19.2", default-features = false, features = [
    "xkbcommon",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wayland-client = "0.31.15"
wayland-egl = "0.32.11"
wayland-scanner = "0.31.11"
zbus = "5"

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.dev.package.rusty-services]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
