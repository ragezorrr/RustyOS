[package]
name = "rusty-terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "RustyOS GPU-accelerated Wayland CSD terminal emulator (RUSTYOS-113)"

[dependencies]
fontdue.workspace = true
libc = "0.2.191"
rustix = { version = "1.1.6", features = ["fs", "process", "pty", "stdio", "termios"] }
rusty-animation.workspace = true
rusty-app.workspace = true
rusty-ui.workspace = true
smithay-client-toolkit = { workspace = true, features = ["calloop"] }
tracing.workspace = true
tracing-subscriber.workspace = true
wayland-client.workspace = true
wayland-egl = "0.32.11"

[build-dependencies]
gl_generator = "0.14.0"

[lints]
workspace = true
