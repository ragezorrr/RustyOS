# mkinitcpio hooks for RustyOS Live ISO (`archiso`, matches official Arch `releng`, `RUSTYOS-115`/`157`).
# Note: `kms` is intentionally omitted here because Live ISO has no `autodetect` hook;
# including `kms` without `autodetect` bloats initramfs to 227+ MB with every GPU firmware blob
# and causes `VFS: Unable to mount root fs on unknown-block(0,0)` on strict UEFI firmware.
# UEFI GOP (`simpledrm`, built into `vmlinuz-linux`) drives Plymouth cleanly during early boot,
# and full GPU modules load from `airootfs.sfs` right after root switch.
HOOKS=(base udev microcode modconf plymouth memdisk archiso archiso_loop_mnt block filesystems keyboard)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-19)
