insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod all_video
set timeout=3
set default=0

menuentry "RustyOS Live Desktop & Installer" {
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nvme_load=YES quiet splash loglevel=3 rd.udev.log_level=3 vt.global_cursor_default=0
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}

menuentry "RustyOS Live (Console / Verbose)" {
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nvme_load=YES
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}
