name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, Check, Clippy & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            build-essential \
            libwayland-dev \
            libxkbcommon-dev \
            libudev-dev \
            libinput-dev \
            libgbm-dev \
            libdrm-dev \
            libseat-dev \
            libegl-dev \
            libgles-dev \
            libpixman-1-dev \
            libpipewire-0.3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace compilation
        run: cargo check --workspace

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run compositor smoke check
        run: cargo run -p rusty-compositor -- --check

  arch-packaging:
    name: Arch Linux PKGBUILD & Asset Validation
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: write
    steps:
      - name: Install Arch build and validation dependencies
        run: |
          pacman -Syu --noconfirm \
            git rust pkgconf gnupg \
            wayland libxkbcommon mesa libglvnd libinput systemd-libs seatd \
            dbus fontconfig ttf-jetbrains-mono xorg-xwayland pipewire \
            xdg-desktop-portal polkit pacman-contrib desktop-file-utils libxml2

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate shell scripts, desktop entries, and Polkit policy
        run: |
          sh -n bin/rustyos-session
          bash -n packaging/arch/PKGBUILD scripts/install.sh scripts/rustyos-install.sh packaging/archiso/profiledef.sh packaging/archiso/build-iso.sh
          desktop-file-validate \
            packaging/applications/org.rustyos.files.desktop \
            packaging/applications/org.rustyos.settings.desktop \
            packaging/applications/org.rustyos.terminal.desktop \
            packaging/applications/org.rustyos.updater.desktop \
            packaging/applications/org.rustyos.installer.desktop \
            packaging/archiso/airootfs/etc/skel/Desktop/install-rustyos.desktop
          xmllint --noout packaging/polkit/org.rustyos.updater.policy packaging/polkit/org.rustyos.installer.policy
          ./scripts/rustyos-install.sh --dry-run --target-disk /dev/vda --username rusty --hostname rustyos

      - name: Build isolated Arch package with makepkg
        run: |
          useradd -m builder
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          mkdir -p /tmp/rustyos-pkg/{build,pkg,src,log}
          chown -R builder:builder "${GITHUB_WORKSPACE}" /tmp/rustyos-pkg
          su - builder -c "cd '${GITHUB_WORKSPACE}/packaging/arch' && \
            BUILDDIR=/tmp/rustyos-pkg/build \
            PKGDEST=/tmp/rustyos-pkg/pkg \
            SRCDEST=/tmp/rustyos-pkg/src \
            LOGDEST=/tmp/rustyos-pkg/log \
            makepkg -f --noconfirm --nocheck --noprogressbar"
          pacman -Qlp /tmp/rustyos-pkg/pkg/rustyos-git-*.pkg.tar.* | grep -F "/usr/bin/rusty-compositor"
          pacman -Qlp /tmp/rustyos-pkg/pkg/rustyos-git-*.pkg.tar.* | grep -F "/usr/bin/rustyos-session"
          pacman -Qlp /tmp/rustyos-pkg/pkg/rustyos-git-*.pkg.tar.* | grep -F "/usr/bin/rusty-files"
          pacman -Qlp /tmp/rustyos-pkg/pkg/rustyos-git-*.pkg.tar.* | grep -F "/usr/bin/rusty-settings"
          pacman -Qlp /tmp/rustyos-pkg/pkg/rustyos-git-*.pkg.tar.* | grep -F "/usr/bin/rusty-terminal"
          pacman -Qlp /tmp/rustyos-pkg/pkg/rustyos-git-*.pkg.tar.* | grep -F "/usr/bin/rusty-installer"
          pacman -Qlp /tmp/rustyos-pkg/pkg/rustyos-git-*.pkg.tar.* | grep -F "/usr/lib/rustyos/rustyos-update-helper"
          pacman -Qlp /tmp/rustyos-pkg/pkg/rustyos-git-*.pkg.tar.* | grep -F "/usr/lib/rustyos/rustyos-install"
          pacman -Qlp /tmp/rustyos-pkg/pkg/rustyos-git-*.pkg.tar.* | grep -F "/usr/share/wayland-sessions/rustyos.desktop"
          pacman -Qlp /tmp/rustyos-pkg/pkg/rustyos-git-*.pkg.tar.* | grep -F "/usr/share/applications/org.rustyos.files.desktop"
          pacman -Qlp /tmp/rustyos-pkg/pkg/rustyos-git-*.pkg.tar.* | grep -F "/usr/share/applications/org.rustyos.settings.desktop"
          pacman -Qlp /tmp/rustyos-pkg/pkg/rustyos-git-*.pkg.tar.* | grep -F "/usr/share/applications/org.rustyos.terminal.desktop"
          pacman -Qlp /tmp/rustyos-pkg/pkg/rustyos-git-*.pkg.tar.* | grep -F "/usr/share/applications/org.rustyos.updater.desktop"
          pacman -Qlp /tmp/rustyos-pkg/pkg/rustyos-git-*.pkg.tar.* | grep -F "/usr/share/applications/org.rustyos.installer.desktop"
          pacman -Qlp /tmp/rustyos-pkg/pkg/rustyos-git-*.pkg.tar.* | grep -F "/usr/share/polkit-1/actions/org.rustyos.updater.policy"
          pacman -Qlp /tmp/rustyos-pkg/pkg/rustyos-git-*.pkg.tar.* | grep -F "/usr/share/polkit-1/actions/org.rustyos.installer.policy"

      - name: Assemble Pacman repository and publish to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_DIR="${GITHUB_WORKSPACE}/deploy/repo"
          mkdir -p "${REPO_DIR}/x86_64"
          cp -f /tmp/rustyos-pkg/pkg/rustyos-git-*.pkg.tar.* "${REPO_DIR}/x86_64/"
          cd "${REPO_DIR}/x86_64"

          if [ -n "${GPG_SIGNING_KEY:-}" ]; then
            echo "Importing GPG signing key from secrets..."
            echo "${GPG_SIGNING_KEY}" | gpg --batch --import || true
            KEY_ID=$(gpg --list-secret-keys --with-colons 2>/dev/null | grep '^sec:' | cut -d: -f5 | head -n1 || true)
            if [ -n "${KEY_ID}" ]; then
              echo "Signing packages and repository with key: ${KEY_ID}"
              for pkg in *.pkg.tar.*; do
                gpg --batch --yes --detach-sign --no-armor --default-key "${KEY_ID}" "${pkg}"
              done
              repo-add --sign --key "${KEY_ID}" rustyos.db.tar.zst *.pkg.tar.zst
              gpg --armor --export "${KEY_ID}" > rustyos.asc
            else
              echo "GPG key import produced no key ID; falling back to standard repository..."
              repo-add rustyos.db.tar.zst *.pkg.tar.zst
            fi
          else
            echo "GPG_SIGNING_KEY secret not configured; generating standard pacman repository..."
            repo-add rustyos.db.tar.zst *.pkg.tar.zst
          fi

          cat << 'EOF' > "${REPO_DIR}/index.html"
          <!DOCTYPE html>
          <html>
          <head><meta charset="utf-8"><title>RustyOS Arch Linux Repository</title></head>
          <body style="font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 680px; margin: 40px auto; line-height: 1.6; color: #1d1d1f; padding: 0 16px;">
            <h2>RustyOS Arch Linux Repository</h2>
            <p>Official continuous integration repository for the RustyOS desktop environment.</p>
            <h3>Add to /etc/pacman.conf</h3>
            <pre style="background: #f5f5f7; padding: 14px; border-radius: 8px; overflow-x: auto;">[rustyos]
          SigLevel = Optional TrustAll
          Server = https://ragezorrr.github.io/RustyOS/repo/$arch</pre>
            <p>Then synchronize and upgrade:</p>
            <pre style="background: #f5f5f7; padding: 14px; border-radius: 8px; overflow-x: auto;">sudo pacman -Syu</pre>
          </body>
          </html>
          EOF

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory /tmp/gh-pages-deploy
          TMP_PAGES="/tmp/gh-pages-deploy"
          rm -rf "${TMP_PAGES}"
          mkdir -p "${TMP_PAGES}"
          cd "${TMP_PAGES}"
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch --depth=1 origin gh-pages; then
            git checkout -b gh-pages origin/gh-pages
          else
            git checkout -b gh-pages
          fi
          mkdir -p repo
          cp -rf "${REPO_DIR}/"* repo/
          cp -f "${REPO_DIR}/index.html" index.html
          git add .
          if git status --porcelain | grep -q .; then
            git commit -m "deploy: update Arch pacman repository for ${GITHUB_SHA::8} [skip ci]"
            git push origin gh-pages
          else
            echo "No repository changes to commit."
          fi

      - name: Upload repository artifacts for run inspection
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: rustyos-pacman-repo
          path: deploy/repo/
          if-no-files-found: error

  arch-live-iso:
    name: Build Arch Live ISO (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged
    steps:
      - name: Install Arch ISO builder and package build dependencies
        run: |
          pacman -Syu --noconfirm \
            git rust pkgconf archiso pacman-contrib \
            wayland libxkbcommon mesa libglvnd libinput systemd-libs seatd \
            dbus fontconfig ttf-jetbrains-mono xorg-xwayland pipewire \
            xdg-desktop-portal polkit

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build rustyos-git package and Live ISO
        run: |
          useradd -m builder
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          mkdir -p /tmp/rustyos-pkg/{build,pkg,src,log} /tmp/rustyos-iso-out
          chown -R builder:builder "${GITHUB_WORKSPACE}" /tmp/rustyos-pkg
          su - builder -c "cd '${GITHUB_WORKSPACE}/packaging/arch' && \
            BUILDDIR=/tmp/rustyos-pkg/build \
            PKGDEST=/tmp/rustyos-pkg/pkg \
            SRCDEST=/tmp/rustyos-pkg/src \
            LOGDEST=/tmp/rustyos-pkg/log \
            makepkg -f --noconfirm --nocheck --noprogressbar"
          ./packaging/archiso/build-iso.sh \
            --local-repo-dir /tmp/rustyos-pkg/pkg \
            --out-dir /tmp/rustyos-iso-out

      - name: Upload Live ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustyos-live-iso
          path: /tmp/rustyos-iso-out/rustyos-live-*.iso
          if-no-files-found: error
