<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>RustyOS Arch Linux Repository</title></head>
<body style="font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 680px; margin: 40px auto; line-height: 1.6; color: #1d1d1f; padding: 0 16px;">
  <h2>RustyOS Arch Linux Repository</h2>
  <p>Official continuous integration repository for the RustyOS desktop environment.</p>
  <h3>Add to /etc/pacman.conf</h3>
  <pre style="background: #f5f5f7; padding: 14px; border-radius: 8px; overflow-x: auto;">[rustyos]
SigLevel = Optional TrustAll
Server = https://ragezorrr.github.io/RustyOS/repo/$arch</pre>
  <p>Then synchronize and upgrade:</p>
  <pre style="background: #f5f5f7; padding: 14px; border-radius: 8px; overflow-x: auto;">sudo pacman -Syu</pre>
</body>
</html>
